repository:
  path: /home/atif/junction_food_resturant_website
stack:
  frontend: [Blade, Tailwind CSS, Alpine.js]
  backend: [Laravel 12]
  database: []
  infrastructure: [Hostinger VPS, Ubuntu 24.04, Nginx, PHP 8.5 FPM]
default_skills: [context-intake, research, frontend-ui-ux]
